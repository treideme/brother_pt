name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Action versions checked 2026-11-21 via the release API:
      # actions/checkout v7.0.1, actions/setup-python v7.1.0. Pinned to the major.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install fontconfig and a default font
        # The text renderer (brother_pt/font.py) selects fonts through
        # fontconfig; the fontconfig-py wheel bundles libfontconfig itself but
        # still needs the on-disk fontconfig config and at least one real font
        # so the default "sans-serif" pattern resolves. A bare runner may ship
        # neither, so install them explicitly to keep the text tests green.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core
      - name: Install the package and its dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run the unit tests
        run: python -m unittest discover -s tests -t .
