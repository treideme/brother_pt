[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brother_pt"
dynamic = ["version"]
description = "Python package for the raster language protocol of the Brother PT series of connected label printers"
authors = [{name = "Thomas Reidemeister", email = "treideme@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyusb>=1.2.1",
    "Pillow>=10",
    "packbits>=0.6",
    # Text rendering engine (brother_pt/font.py): FreeType monochrome hinting,
    # HarfBuzz shaping and fontconfig font selection.
    # Versions checked on PyPI 2026-11-22; pinned to the current release.
    "freetype-py>=2.5.1",
    "vharfbuzz>=0.3.1",
    "fontconfig-py>=1.0.3",
]

[project.urls]
Homepage = "https://github.com/treideme/brother_pt"

# The README documents a `brother_pt` command; the old setup.py defined no
# entry point, so only `python -m brother_pt` worked. Wire it up here.
[project.scripts]
brother_pt = "brother_pt.__main__:cli"

[tool.setuptools]
packages = ["brother_pt"]

[tool.setuptools.dynamic]
version = {attr = "brother_pt.VERSION"}
